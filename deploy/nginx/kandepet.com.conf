# /etc/nginx/sites-available/kandepet.com
# Host nginx in front of the kandepet Docker stack (Caddy on 127.0.0.1:8095).
# Starts as plain HTTP; `certbot --nginx ... --redirect` adds HTTPS to it after the DNS switch.

server {
    listen 80;
    listen [::]:80;
    server_name kandepet.com www.kandepet.com comments.kandepet.com;

    client_max_body_size 5m;   # Remark42 image uploads

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
