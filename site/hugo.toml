baseURL = "https://kandepet.com/"
title = "Deepak Kandepet"
locale = "en-US"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# Keep the WordPress URL structure so old links (and imported comments) still match.
[permalinks]
  [permalinks.page]
    posts = "/:slug/"
    portfolio = "/portfolio/:slug/"
  [permalinks.term]
    categories = "/category/:slug/"
    tags = "/tag/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON powers the search page

[markup]
  [markup.goldmark.renderer]
    unsafe = true                  # migrated posts contain some raw HTML (tables, etc.)
  [markup.highlight]
    noClasses = false
    lineNos = false

[params]
  env = "production"
  description = "Notes on hardware, firmware and software internals."
  author = "Deepak Kandepet"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false
  comments = true                  # renders layouts/_partials/comments.html (Remark42)

  [params.remark42]
    host = "https://comments.kandepet.com"
    siteID = "kandepet"
    siteURL = "https://kandepet.com"   # comment threads are keyed by production URL

  [params.homeInfoParams]
    Title = "Deepak Kandepet"
    Content = "Teardowns and deep dives into how things work, from Ethernet controllers and search indexes to keyboards, flashlights and 3D printers."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/kandepet"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/deepakkandepet"
  [[params.socialIcons]]
    name = "x"
    url = "https://twitter.com/kandepet"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    keys = ["title", "permalink", "summary", "content"]

[menus]
  [[menus.main]]
    name = "Archives"
    pageRef = "/archives"
    weight = 10
  [[menus.main]]
    name = "Portfolio"
    pageRef = "/portfolio"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about-me"
    weight = 30
  [[menus.main]]
    name = "Search"
    pageRef = "/search"
    weight = 40
