baseURL = "https://kandepet.com/"
title = "Deepak Kandepet"
locale = "en-US"
theme = "kandepet"
enableRobotsTXT = true
capitalizeListTitles = false   # keep category names as written ("hacking", not "Hacking")

[pagination]
  pagerSize = 10

# Keep the WordPress URL structure so old links (and imported comments) still match.
[permalinks]
  [permalinks.page]
    posts = "/:slug/"
    portfolio = "/portfolio/:slug/"
  [permalinks.term]
    categories = "/category/:slug/"
    tags = "/tag/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true                  # migrated posts contain some raw HTML (tables, etc.)
  [markup.highlight]
    style = "github"
    lineNos = false

[params]
  description = "Notes on hardware, firmware and software internals."
  author = "deepak"
  comments = true                  # renders layouts/_partials/comments.html (Remark42)

  [params.remark42]
    host = "https://comments.kandepet.com"
    siteID = "kandepet"
    siteURL = "https://kandepet.com"   # comment threads are keyed by production URL

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Projects"
    pageRef = "/portfolio"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about-me"
    weight = 30
