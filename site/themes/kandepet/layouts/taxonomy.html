{{ define "main" }}
  <header class="archive-header"><h1 class="archive-title">{{ .Title }}</h1></header>
  <ul class="term-list">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a> <span class="count">({{ .Count }})</span></li>
    {{- end }}
  </ul>
{{ end }}
