<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}home{{ else }}{{ .Kind }}{{ end }}">
  <div class="site">
    {{- partial "header.html" . }}
    <main class="site-main">
      {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
  </div>
</body>
</html>
