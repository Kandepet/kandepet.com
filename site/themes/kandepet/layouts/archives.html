{{ define "main" }}
  <header class="archive-header"><h1 class="archive-title">{{ .Title }}</h1></header>
  {{- range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
  <section class="archive-year">
    <h2>{{ .Key }}</h2>
    <ul>
      {{- range .Pages }}
      <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{- end }}
    </ul>
  </section>
  {{- end }}
{{ end }}
