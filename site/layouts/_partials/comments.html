{{- /* Remark42 comments. Kept in the site (not the theme) so it survives theme changes. */ -}}
{{- with site.Params.remark42 }}
<div id="remark42" style="margin-top: 2rem;"></div>
<script>
  var remark_config = {
    host: {{ .host }},
    site_id: {{ .siteID }},
    // Always the production URL, so local previews show (and never create) the real threads.
    url: {{ printf "%s%s" (strings.TrimSuffix "/" .siteURL) $.RelPermalink }},
    page_title: {{ $.Title }},
    components: ["embed"],
    theme: document.documentElement.dataset.theme === "dark" ? "dark" : "light",
    no_footer: true,
  };
  (function (c, d) {
    for (var i = 0; i < c.length; i++) {
      var s = d.createElement("script"), ext = ".js", h = d.head || d.body;
      if ("noModule" in s) { s.type = "module"; ext = ".mjs"; } else { s.async = true; }
      s.defer = true;
      s.src = remark_config.host + "/web/" + c[i] + ext;
      h.appendChild(s);
    }
  })(remark_config.components, document);

  // Follow the site's light/dark toggle.
  new MutationObserver(function () {
    if (window.REMARK42 && window.REMARK42.changeTheme) {
      window.REMARK42.changeTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
{{- end }}
